<!doctype html>
<html lang="en" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two-factor · Resourcing</title>
  <link rel="icon" href="../../logos/products/operate/resourcing.svg">
  <!-- Apply saved / preferred mode before first paint (no flash) -->
  <script>(function(){var m=localStorage.getItem("op-mode")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");var r=document.documentElement;r.setAttribute("data-mode",m);r.classList.add("op-no-motion");})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="../../css/officepress.css">
  <link rel="stylesheet" href="../../css/families/operate.css" id="op-family"><!-- family: operate -->
  <script src="../../js/icons.js" defer></script>
  <script src="../../js/officepress.js" defer></script>
</head>
<body data-app="resourcing">
<div class="op-auth">
  <header class="op-auth__top">
    <span class="op-brand__logo"><img src="../../logos/products/operate/resourcing.svg" alt=""></span>
    <span class="op-title op-grow">Resourcing</span>
    <button class="op-icon-btn op-icon-btn--circle op-theme-btn" type="button" aria-label="Switch to dark mode" data-action="toggle-mode"><svg class="op-icon op-icon--sun" aria-hidden="true"><use href="#i-sun"/></svg><svg class="op-icon op-icon--moon" aria-hidden="true"><use href="#i-moon"/></svg></button>
  </header>
  <main class="op-auth__main"><div class="op-auth__column">
    <div class="op-auth__head"><a class="op-auth__back" href="sign-in.html"><svg class="op-icon op-icon--14" aria-hidden="true"><use href="#i-arrow-left"/></svg>Use a different account</a><h1 class="op-display">Enter your code</h1><p class="op-muted">Open your authenticator app and enter the 6-digit code for Resourcing.</p></div>
    <form class="op-fields" onsubmit="return false">
      <div class="op-otp"><input inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Digit"><input inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Digit"><input inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Digit"><input inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Digit"><input inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Digit"><input inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Digit"></div>
      <label class="op-check"><input type="checkbox" checked><span>Trust this device for 30 days</span></label>
      <button class="op-btn op-btn--primary op-btn--large op-btn--block" type="submit">Verify</button>
    </form>
    <div class="op-links op-links--center"><a href="#">Use a recovery method</a></div>
  </div></main>
  <footer class="op-auth__foot">Resourcing · Workspace access</footer>
</div>
</body>
</html>
